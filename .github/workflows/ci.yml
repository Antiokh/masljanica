name: Build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Install browser for smoke test
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test SPA navigation and offline audio
        run: node scripts/smoke-offline.mjs
